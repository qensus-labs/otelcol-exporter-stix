name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: otelcol-exporter-stix

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: otelcol-exporter-stix

      # go.mod replaces go-stix with the sibling checkout ../go-stix.
      - name: Checkout go-stix
        uses: actions/checkout@v4
        with:
          repository: qensus-labs/go-stix
          path: go-stix

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: otelcol-exporter-stix/go.mod
          cache-dependency-path: otelcol-exporter-stix/go.sum

      - name: Format check
        run: |
          test -z "$(gofmt -l .)"

      - name: Test
        run: |
          go test ./...

      - name: Build
        run: |
          go build ./...
